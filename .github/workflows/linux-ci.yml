name: Linux CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  linux-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Pull pinned lab image
        run: docker compose pull --policy always lab

      - name: Run Linux tests
        run: docker compose run --rm --no-deps -T lab timeout --kill-after=2s 60s bash tests/run.sh --lab

      - name: Verify Ansible installation and idempotence
        shell: bash
        env:
          ANSIBLE_NOCOLOR: '1'
          ANSIBLE_STDOUT_CALLBACK: default
        run: |
          inventory="$RUNNER_TEMP/lab.ini"
          printf '[lab]\nlocalhost ansible_connection=local ansible_python_interpreter=/usr/bin/python3\n' > "$inventory"
          ansible-playbook -i "$inventory" ansible/install-tools.yml

          installed=/opt/azure-infra-lab
          diff -r scripts/ "$installed/scripts/"
          test "$(stat -c '%U:%G:%a' "$installed")" = 'root:root:755'
          test "$(stat -c '%U:%G:%a' "$installed/scripts/check-environment.sh")" = 'root:root:755'
          bash "$installed/scripts/check-environment.sh"

          ansible-playbook -i "$inventory" ansible/install-tools.yml | tee "$RUNNER_TEMP/ansible-second-run.log"
          grep -Eq '^localhost[[:space:]]*:[[:space:]]+ok=[1-9][0-9]*[[:space:]]+changed=0[[:space:]]+unreachable=0[[:space:]]+failed=0' "$RUNNER_TEMP/ansible-second-run.log"
