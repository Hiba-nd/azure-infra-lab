name: Linux CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  linux-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Pull pinned lab image
        run: docker compose pull --policy always lab

      - name: Run Linux tests
        run: docker compose run --rm --no-deps -T lab timeout --kill-after=2s 60s bash tests/run.sh --lab

      - name: Test inventory generation
        run: python3 tests/test-inventory.py -v

      - name: Test Azure deployment preflight
        run: python3 tests/test-azure-preflight.py -v

      - name: Verify Ansible deployment and permission repair over SSH
        run: bash tests/test-ansible-ssh.sh

      - name: Verify the systemd health check timer
        run: bash tests/test-systemd-monitoring.sh

      - name: Verify scheduled backups and restore
        run: bash tests/test-scheduled-backup.sh
