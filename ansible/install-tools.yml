---
- name: Install the lab tools
  hosts: lab
  become: true
  gather_facts: false
  vars:
    lab_install_dir: /opt/azure-infra-lab
    lab_configure_health_timer: false

  tasks:
    - name: Create the installation directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - "{{ lab_install_dir }}"
        - "{{ lab_install_dir }}/scripts"

    - name: Copy the lab scripts and their libraries
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../scripts/"
        dest: "{{ lab_install_dir }}/scripts/"
        owner: root
        group: root
        mode: preserve
        directory_mode: "0755"

    - name: Schedule health checks
      when: lab_configure_health_timer | bool
      block:
        - name: Install the systemd health check units
          ansible.builtin.template:
            src: "{{ item }}.j2"
            dest: "/etc/systemd/system/{{ item }}"
            owner: root
            group: root
            mode: "0644"
          loop:
            - azure-infra-health.service
            - azure-infra-health.timer

        - name: Enable and start the health check timer
          ansible.builtin.systemd_service:
            name: azure-infra-health.timer
            daemon_reload: true
            enabled: true
            state: started
