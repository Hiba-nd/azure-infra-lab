---
- name: Install the lab tools
  hosts: lab
  become: true
  gather_facts: false
  vars:
    lab_install_dir: /opt/azure-infra-lab
    lab_configure_health_timer: false
    lab_health_disk_path: /
    lab_health_process: ""

  tasks:
    - name: Validate scheduled health check settings
      when: lab_configure_health_timer | bool
      ansible.builtin.assert:
        that:
          - lab_health_disk_path is string
          - lab_health_disk_path.startswith('/')
          - lab_health_disk_path is not search('[\\x00-\\x1f\\x7f]')
          - lab_health_process is string
          - lab_health_process == '' or lab_health_process is match('^[a-zA-Z0-9_.:-]{1,15}\\Z')
        fail_msg: Use an absolute disk path without control characters and a valid Linux process name.
        quiet: true

    - name: Create the installation directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - "{{ lab_install_dir }}"
        - "{{ lab_install_dir }}/scripts"

    - name: Copy the lab scripts and their libraries
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../scripts/"
        dest: "{{ lab_install_dir }}/scripts/"
        owner: root
        group: root
        mode: preserve
        directory_mode: "0755"

    - name: Schedule health checks
      when: lab_configure_health_timer | bool
      block:
        - name: Install the systemd health check units
          ansible.builtin.template:
            src: "{{ item }}.j2"
            dest: "/etc/systemd/system/{{ item }}"
            owner: root
            group: root
            mode: "0644"
          loop:
            - azure-infra-health.service
            - azure-infra-health.timer

        - name: Enable and start the health check timer
          ansible.builtin.systemd_service:
            name: azure-infra-health.timer
            daemon_reload: true
            enabled: true
            state: started
